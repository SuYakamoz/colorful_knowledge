<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多彩知识宝盒 · 常识集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh; color: #4A4458; padding: 20px 14px 48px;
    background: linear-gradient(150deg, #FDF2F8 0%, #F3F0FF 35%, #EDE9FE 70%, #FCE7F3 100%);
    position: relative; overflow-x: hidden;
  }
  /* 背景装饰光斑(增强玻璃质感) */
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .5; z-index: 0; pointer-events: none; }
  .blob-1 { width: 320px; height: 320px; background: #F9A8D4; top: -80px; right: -80px; }
  .blob-2 { width: 280px; height: 280px; background: #C4B5FD; bottom: -60px; left: -60px; }
  .blob-3 { width: 200px; height: 200px; background: #FBCFE8; top: 40%; left: 70%; }

  .container { max-width: 700px; margin: 0 auto; position: relative; z-index: 1; }

  /* 玻璃卡片通用 */
  .glass {
    background: rgba(255, 255, 255, .55);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, .7);
    box-shadow: 0 8px 32px rgba(90, 70, 150, .10);
    border-radius: 18px;
  }

  /* 头部 */
  .header { text-align: center; margin: 10px 0 24px; }
  .logo {
    width: 80px; height: 80px; border-radius: 22px; margin: 0 auto 14px;
    box-shadow: 0 10px 28px rgba(236, 72, 153, .16); display: block;
  }
  h1 {
    font-size: 25px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg, #EC4899, #8B5CF6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: #9C93B0; font-size: 13px; margin-top: 6px; }

  /* 今日卡片(玻璃风,顶部细渐变线点缀) */
  .today-card { padding: 20px 20px 16px; margin-bottom: 22px; position: relative; overflow: hidden; }
  .today-card::before {
    content: ""; position: absolute; top: 0; left: 20px; right: 20px; height: 3px;
    background: linear-gradient(90deg, #F9A8D4, #C4B5FD); border-radius: 0 0 6px 6px;
  }
  .today-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .today-title { font-size: 16px; font-weight: 800; background: linear-gradient(90deg,#EC4899,#8B5CF6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .today-date { font-size: 12px; color: #7C6FA8; background: rgba(255,255,255,.6); padding: 3px 10px; border-radius: 999px; }
  .lunar-line {
    background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.7);
    border-radius: 12px; padding: 8px 12px; margin-bottom: 10px;
    font-size: 13px; color: #92400E; font-weight: 600;
  }
  .today-item { display: flex; gap: 8px; margin: 9px 0; font-size: 14.5px; line-height: 1.65; }
  .today-item .tag { flex-shrink: 0; margin-top: 2px; }
  .today-item span:last-child { flex: 1; min-width: 0; word-break: break-word; }

  /* 标签:统一玻璃色(不再五花八门) */
  .tag {
    display: inline-block; border-radius: 8px; padding: 2px 10px;
    font-size: 12px; font-weight: 600; white-space: nowrap; align-self: flex-start;
    background: rgba(255,255,255,.65); color: #7C6FA8;
    border: 1px solid rgba(255,255,255,.8);
  }

  /* 历史列表(玻璃卡片) */
  .section-title { font-size: 15px; font-weight: 800; color: #9C93B0; margin: 6px 4px 12px; }
  .day-card { padding: 15px 17px; margin-bottom: 12px; transition: transform .18s, box-shadow .18s; }
  .day-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(90,70,150,.16); }
  .day-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .day-date { font-weight: 800; font-size: 14px; background: linear-gradient(90deg,#EC4899,#8B5CF6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .day-src { font-size: 11px; color: #92400E; background: rgba(255,255,255,.6); padding: 2px 8px; border-radius: 999px; }
  .day-item { display: flex; gap: 8px; margin: 7px 0; font-size: 14px; line-height: 1.7; }
  .day-item .tag { flex-shrink: 0; margin-top: 2px; }
  .day-item span:last-child { flex: 1; min-width: 0; word-break: break-word; }

  .empty { text-align: center; color: #B7AECF; padding: 48px 0; font-size: 14px; }
  .footer { text-align: center; color: #B7AECF; font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
<div class="container">
  <div class="header">
    <img class="logo" src="assets/logo.png" alt="多彩知识宝盒">
    <h1>多彩知识宝盒</h1>
    <div class="subtitle">每天 3 条常识 · 天天长知识</div>
  </div>

  <div id="latest"><div class="empty">加载中…</div></div>

  <div class="section-title">📚 历史积累</div>
  <div id="list"><div class="empty">加载中…</div></div>

  <div class="footer" id="footer"></div>
</div>

<script>
function tag(cat) {
  return '<span class="tag">' + cat + '</span>';
}

fetch("data/latest.json").then(r => r.ok ? r.json() : null).then(latest => {
  var el = document.getElementById("latest");
  if (!latest || !latest.items || !latest.items.length) { el.innerHTML = ""; return; }
  var lunarHtml = "";
  if (latest.lunar) {
    lunarHtml = '<div class="lunar-line">📅 ' + latest.lunar.lunar + " · " + latest.lunar.ganzhi +
      (latest.lunar.term ? " · ☀️" + latest.lunar.term : "") +
      (latest.lunar.festival ? " · 🎉" + latest.lunar.festival : "") + '</div>';
  }
  el.innerHTML = '<div class="today-card glass">' +
    '<div class="today-head"><span class="today-title">📌 今日卡片</span>' +
    '<span class="today-date">' + latest.date + '</span></div>' + lunarHtml +
    latest.items.map(i => '<div class="today-item">' + tag(i.category) + '<span>' + i.content + '</span></div>').join("") +
    '</div>';
}).catch(() => {});

fetch("data/common_sense.jsonl").then(r => r.text()).then(text => {
  var rows = text.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).reverse();
  var el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = '<div class="empty">暂无数据,明天开始积累</div>'; return; }
  var byDate = {};
  rows.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  el.innerHTML = Object.entries(byDate).map(([d, items]) =>
    '<div class="day-card glass"><div class="day-head"><span class="day-date">' + d + '</span>' +
    (items[0].source === "ai" ? "" : '<span class="day-src">知识库兜底</span>') + '</div>' +
    items.map(i => '<div class="day-item">' + tag(i.category) + '<span>' + i.content + '</span></div>').join("") +
    '</div>').join("");
  document.getElementById("footer").textContent = "共积累 " + rows.length + " 条常识";
}).catch(() => { document.getElementById("list").innerHTML = '<div class="empty">数据读取失败</div>'; });
</script>
</body>
</html>
