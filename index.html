<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多彩知识宝盒 · 常识集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(160deg, #FDF2F8 0%, #F5F3FF 45%, #FCE7F3 100%);
    min-height: 100vh; color: #4A4458; padding: 20px 14px 48px;
  }
  .container { max-width: 700px; margin: 0 auto; }

  /* 头部 */
  .header { text-align: center; margin: 10px 0 22px; }
  .logo {
    width: 80px; height: 80px; border-radius: 22px; margin: 0 auto 14px;
    box-shadow: 0 10px 28px rgba(236, 72, 153, .18); display: block;
  }
  h1 {
    font-size: 25px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg, #EC4899, #8B5CF6, #EC4899);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { color: #A79FB8; font-size: 13px; margin-top: 6px; }

  /* 今日卡片:柔和粉紫渐变 */
  .today-card {
    background: linear-gradient(135deg, #FBCFE8 0%, #E9D5FF 60%, #F5D0FE 100%);
    border: 1px solid rgba(236, 72, 153, .12);
    border-radius: 20px; padding: 20px 20px 16px;
    box-shadow: 0 10px 30px rgba(217, 70, 239, .12);
    margin-bottom: 22px; color: #5B21B6;
  }
  .today-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .today-title { font-size: 16px; font-weight: 800; color: #A21CAF; }
  .today-date { font-size: 12px; color: #A21CAF; background: rgba(255,255,255,.55); padding: 3px 10px; border-radius: 999px; }
  .lunar-line {
    background: rgba(255,255,255,.5); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px;
    font-size: 13px; color: #92400E; font-weight: 600;
  }
  .today-item { display: flex; gap: 8px; margin: 9px 0; font-size: 14.5px; line-height: 1.65; }
  .today-item .tag { flex-shrink: 0; margin-top: 2px; }
  .today-item span:last-child { flex: 1; min-width: 0; word-break: break-word; }

  /* 分类标签:马卡龙柔和色(淡底深字,不刺眼) */
  .tag {
    display: inline-block; border-radius: 8px; padding: 2px 10px;
    font-size: 12px; font-weight: 700; white-space: nowrap; align-self: flex-start;
  }
  .tag[data-c="金融"] { background: #FEF3C7; color: #92400E; }
  .tag[data-c="职场"] { background: #DBEAFE; color: #1E40AF; }
  .tag[data-c="生活"] { background: #FFEDD5; color: #9A3412; }
  .tag[data-c="科学"] { background: #EDE9FE; color: #6D28D9; }
  .tag[data-c="历史"] { background: #FEE2E2; color: #991B1B; }
  .tag[data-c="健康"] { background: #D1FAE5; color: #065F46; }
  .tag[data-c="冷知识"] { background: #FCE7F3; color: #9D174D; }
  .tag[data-c="法律"] { background: #E0E7FF; color: #3730A3; }
  .tag[data-c="科技"] { background: #CFFAFE; color: #155E75; }
  .tag[data-c="心理"] { background: #CCFBF1; color: #115E59; }
  .tag[data-c="安全"] { background: #FFE4E6; color: #9F1239; }
  .tag[data-c="商业"] { background: #FEF9C3; color: #854D0E; }
  .tag[data-c="教育"] { background: #ECFCCB; color: #3F6212; }
  .tag[data-c="地理"] { background: #CFFAFE; color: #164E63; }
  .tag[data-c="运动"] { background: #FFEDD5; color: #9A3412; }
  .tag[data-c="文化"] { background: #FAE8FF; color: #86198F; }
  .tag[data-c="默认"] { background: #F3F4F6; color: #4B5563; }

  /* 历史列表 */
  .section-title { font-size: 15px; font-weight: 800; color: #A79FB8; margin: 6px 4px 12px; }
  .day-card {
    background: rgba(255,255,255,.85); border: 1px solid rgba(236,72,153,.08);
    border-radius: 16px; padding: 15px 17px; margin-bottom: 12px;
    box-shadow: 0 3px 14px rgba(217, 70, 239, .08);
    transition: transform .18s, box-shadow .18s;
  }
  .day-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(217,70,239,.14); }
  .day-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .day-date { font-weight: 800; font-size: 14px; color: #A21CAF; }
  .day-src { font-size: 11px; color: #92400E; background: #FEF3C7; padding: 2px 8px; border-radius: 999px; }
  .day-item { display: flex; gap: 8px; margin: 7px 0; font-size: 14px; line-height: 1.7; color: #4A4458; }
  .day-item .tag { flex-shrink: 0; margin-top: 2px; }
  .day-item span:last-child { flex: 1; min-width: 0; word-break: break-word; }

  .empty { text-align: center; color: #C4B5FD; padding: 48px 0; font-size: 14px; }
  .footer { text-align: center; color: #C4B5FD; font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img class="logo" src="assets/logo.png" alt="多彩知识宝盒">
    <h1>多彩知识宝盒</h1>
    <div class="subtitle">每天 3 条常识 · 天天长知识</div>
  </div>

  <div id="latest"><div class="empty">加载中…</div></div>

  <div class="section-title">📚 历史积累</div>
  <div id="list"><div class="empty">加载中…</div></div>

  <div class="footer" id="footer"></div>
</div>

<script>
// 分类标签配色(前缀匹配)
function tag(cat) {
  var key = "默认";
  var map = ["金融","职场","生活","科学","历史","健康","冷知识","法律","科技","心理","安全","商业","教育","地理","运动","文化"];
  for (var i = 0; i < map.length; i++) {
    if (cat.indexOf(map[i]) !== -1) { key = map[i]; break; }
  }
  return '<span class="tag" data-c="' + key + '">' + cat + '</span>';
}

// 今日卡片(与最近一次推送一致,含农历)
fetch("data/latest.json").then(r => r.ok ? r.json() : null).then(latest => {
  var el = document.getElementById("latest");
  if (!latest || !latest.items || !latest.items.length) { el.innerHTML = ""; return; }
  var lunarHtml = "";
  if (latest.lunar) {
    lunarHtml = '<div class="lunar-line">📅 ' + latest.lunar.lunar + " · " + latest.lunar.ganzhi +
      (latest.lunar.term ? " · ☀️" + latest.lunar.term : "") +
      (latest.lunar.festival ? " · 🎉" + latest.lunar.festival : "") + '</div>';
  }
  el.innerHTML = '<div class="today-card">' +
    '<div class="today-head"><span class="today-title">📌 今日卡片</span>' +
    '<span class="today-date">' + latest.date + '</span></div>' + lunarHtml +
    latest.items.map(i => '<div class="today-item">' + tag(i.category) + '<span>' + i.content + '</span></div>').join("") +
    '</div>';
}).catch(() => {});

// 历史积累(按日期分组)
fetch("data/common_sense.jsonl").then(r => r.text()).then(text => {
  var rows = text.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).reverse();
  var el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = '<div class="empty">暂无数据,明天开始积累</div>'; return; }
  var byDate = {};
  rows.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  el.innerHTML = Object.entries(byDate).map(([d, items]) =>
    '<div class="day-card"><div class="day-head"><span class="day-date">' + d + '</span>' +
    (items[0].source === "ai" ? "" : '<span class="day-src">知识库兜底</span>') + '</div>' +
    items.map(i => '<div class="day-item">' + tag(i.category) + '<span>' + i.content + '</span></div>').join("") +
    '</div>').join("");
  document.getElementById("footer").textContent = "共积累 " + rows.length + " 条常识";
}).catch(() => { document.getElementById("list").innerHTML = '<div class="empty">数据读取失败</div>'; });
</script>
</body>
</html>
